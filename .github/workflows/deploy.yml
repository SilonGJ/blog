name: Production deploy

# Deploys when a push to `main` touches anything other than the files Pages CMS
# edits, and manually from the `deploy-production` action in Pages CMS or the
# Actions UI. Content saves and media uploads happen many times per session, so
# they never deploy on their own: publish them explicitly, or just wait for the
# next code push. A push that mixes both still deploys.
on:
  push:
    branches: [main]
    paths-ignore:
      - "src/content/**" # articles written in Pages CMS
      - "src/links/**" # friend links managed in Pages CMS
      - "public/images/**" # media uploaded through Pages CMS
      - ".pages.yml" # Pages CMS configuration
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: curl --fail --show-error --silent --retry 3 --retry-delay 2 -o /dev/null "https://www.zcx0217.qzz.io/"
