name: Production deploy

# Deploys to production on every push to `main` (i.e. when a pull request is
# merged) and manually from Pages CMS or the Actions UI. The Pages CMS button
# dispatches this workflow on `main`, so it always ships already-merged content.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: curl --fail --show-error --silent --retry 3 --retry-delay 2 -o /dev/null "https://www.zcx0217.qzz.io/"
