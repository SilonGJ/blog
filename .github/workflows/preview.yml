name: Preview

# Manual only. Pages CMS saves and media uploads happen many times per session,
# so nothing previews automatically: the `preview` action in Pages CMS dispatches
# this workflow on demand. The preview worker name is fixed, which keeps its URL
# stable and means only
# the assets that changed since the last preview have to be uploaded.
# Production deployment lives in deploy.yml.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One preview worker: clicking the button twice cancels the superseded run
  # instead of queueing behind it.
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    name: Build and preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # `wrangler preview` needs the (empty) `previews` table in wrangler.toml.
      # `--name` is fixed so the preview URL stays stable.
      # It returns both a Preview URL (always the latest build) and a Deployment
      # URL (unique per build, never changes).
      - name: Deploy preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output="$(pnpm exec wrangler preview --name preview --json)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -r '.preview_urls[0] // empty' 2>/dev/null || true)"
          build_url="$(printf '%s' "$output" | jq -r '.deployment_urls[0] // empty' 2>/dev/null || true)"
          if [ -z "$preview_url" ]; then
            preview_url="$(printf '%s' "$output" | grep -oE 'https://preview-[^" ]+workers\.dev' | head -n1)"
          fi
          if [ -z "$preview_url" ]; then
            echo "Could not parse the preview URL." >&2
            exit 1
          fi
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "build_url=$build_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $preview_url"
          if [ -n "$build_url" ]; then
            echo "This build:  $build_url"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --show-error --silent --retry 3 --retry-delay 2 -o /dev/null "$PREVIEW_URL"

      - name: Write job summary
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          BUILD_URL: ${{ steps.deploy.outputs.build_url }}
        run: |
          {
            echo "## Preview is ready"
            echo ""
            echo "Built from: \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "Preview URL (always the latest build):"
            echo "$PREVIEW_URL"
            if [ -n "$BUILD_URL" ]; then
              echo ""
              echo "This exact build (never changes):"
              echo "$BUILD_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
