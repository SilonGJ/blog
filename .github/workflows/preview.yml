name: Preview

# Manual only. Pages CMS saves and media uploads happen many times per session,
# so nothing previews automatically: the `preview` action in Pages CMS dispatches
# this workflow on demand. The preview worker name is fixed, which keeps its URL
# stable (bookmarkable) and means only the assets that changed since the last
# preview have to be uploaded. Production deployment lives in deploy.yml.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One preview worker: clicking the button twice cancels the superseded run
  # instead of queueing behind it.
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    name: Build and preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # `wrangler preview` needs the (empty) `previews` table in wrangler.toml.
      # `--name` is fixed on purpose: the URL is always
      # https://preview-blog.<subdomain>.workers.dev, and only assets that changed
      # since the previous preview are uploaded.
      - name: Deploy preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output="$(pnpm exec wrangler preview --name preview --json)"
          printf '%s\n' "$output"
          url="$(printf '%s' "$output" | jq -r '.preview.urls[0] // empty' 2>/dev/null || true)"
          if [ -z "$url" ]; then
            url="$(printf '%s' "$output" | grep -oE 'https://[^" ]+workers\.dev' | head -n1)"
          fi
          if [ -z "$url" ]; then
            echo "Could not parse the preview URL." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe preview
        run: curl --fail --show-error --silent --retry 3 --retry-delay 2 -o /dev/null "${{ steps.deploy.outputs.url }}"

      - name: Write job summary
        run: |
          {
            echo "## Preview is ready"
            echo ""
            echo "Preview URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
