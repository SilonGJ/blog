content:
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [image, title, category, tags, published, updated, draft]
      default:
        sort: published
        order: desc
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: published, label: 发布日期, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: updated, label: 更新日期, type: date, default: "", options: { format: yyyy-MM-dd } }
      - { name: description, label: 描述, type: text }
      - { name: tags, label: 标签, type: string, list: true }
      - { name: category, label: 分类, type: string }
      - { name: image, label: 封面图, type: image, options: { media: archive } }
      - { name: draft, label: 草稿, type: boolean }
      - { name: lang, label: 语言, type: string }
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: archive
    actions:
      - name: preview-posts-entry
        label: 更新预览
        scope: entry
        workflow: preview.yml
        ref: current
        confirm:
          title: 更新预览？
          message: 将重新构建当前分支的预览站点。
          button: 更新预览
      - name: preview-posts-collection
        label: 更新预览
        scope: collection
        workflow: preview.yml
        ref: current
        confirm:
          title: 更新预览？
          message: 将重新构建当前分支的预览站点。
          button: 更新预览

  - name: links
    label: 友链
    type: collection
    path: src/links
    filename:
      template: "{primary}.json"
      field: true
    view:
      fields: [icon, name, url, description]
      default:
        sort: name
        order: asc
    fields:
      - { name: name, label: 名称, type: string, required: true }
      - { name: url, label: 网站地址, type: string, required: true }
      - { name: icon, label: 图标, type: image, options: { media: friend } }
      - { name: description, label: 描述, type: text }
    actions:
      - name: preview-links-entry
        label: 更新预览
        scope: entry
        workflow: preview.yml
        ref: current
        confirm:
          title: 更新预览？
          message: 将重新构建当前分支的预览站点。
          button: 更新预览
      - name: preview-links-collection
        label: 更新预览
        scope: collection
        workflow: preview.yml
        ref: current
        confirm:
          title: 更新预览？
          message: 将重新构建当前分支的预览站点。
          button: 更新预览

media:
  - name: images
    label: 图像
    input: public/images
    output: /images
    categories: [image]
    actions:
      - name: preview-media-images
        label: 更新预览
        workflow: preview.yml
        ref: current

  - name: archive
    label: 文章图
    input: public/images/archive
    output: /images/archive
    categories: [image]
    actions:
      - name: preview-media-archive
        label: 更新预览
        workflow: preview.yml
        ref: current

  - name: friend
    label: 友链图
    input: public/images/friend
    output: /images/friend
    categories: [image]
    actions:
      - name: preview-media-friend
        label: 更新预览
        workflow: preview.yml
        ref: current

actions:
  # Always deploys `main` (the already-merged branch), never the branch currently
  # open in Pages CMS. Prefer merging a pull request to publish changes.
  - name: deploy-production
    label: 部署到生产
    workflow: deploy.yml
    ref: main
    confirm:
      title: 部署到生产？
      message: 将把 main 分支（已合并的内容）部署到生产环境。
      button: 部署
